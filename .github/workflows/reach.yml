# Collects package stats every Sunday and publishes the report on GitHub Pages.
# Generated by `pkgreach init`. Docs: https://github.com/thorwhalen/pkgreach
#
# Needs no secret. The history is kept on the `pkgreach-data` branch.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: pkgreach
on:
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pkgreach
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: reach
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.reach.outputs.site-dir }}
      - uses: actions/deploy-pages@v4
        id: deploy
